# Configuration de l'agent SNMP de la fausse borne
# (modèle : __NOM__ et __EMPLACEMENT__ sont remplacés au démarrage par entrypoint.sh)

# Écoute sur le port SNMP standard
agentAddress udp:161

# Accès en lecture seule avec le mot de passe (community) "public"
rocommunity public default

# Identité de la borne
sysName     __NOM__
sysLocation __EMPLACEMENT__
sysContact  noc@netpulse.local

# Métrique métier : nombre de clients WiFi connectés (valeur simulée par un script)
extend clients /bin/sh /usr/local/bin/clients_wifi.sh
